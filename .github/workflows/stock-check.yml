# .github/workflows/stock-check.yml
# 週次で在庫を監査し、「販売終了(該当なし)」があれば削除PRを自動起票する。
# 在庫切れ(availability=0)はキープ（再入荷し得るため）し、サマリはActionsのStep Summaryに出す。
name: Weekly stock check
on:
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 00:00 UTC（＝日本時間 月曜 09:00）
  workflow_dispatch: {}    # 手動実行も可

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run stock check (auto-remove discontinued)
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          node tools/check-stock.mjs --fix | tee stock-summary.txt
          echo '## 在庫監査サマリ' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat stock-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: stock-report
          path: stock-report.json
      - name: Create PR if discontinued items were removed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(stock): 販売終了の商品を自動削除"
          branch: auto/stock-cleanup
          delete-branch: true
          title: "在庫監査: 販売終了の商品を削除（要確認）"
          body: |
            週次在庫チェックで「販売終了(該当なし)」と判定された商品を削除しました。
            マージすると本番へ反映されます。内容を確認してください。
            添付の stock-report.json も参照。
          add-paths: |
            public/js/main.js
            public/index.html
            public/read/*.html
