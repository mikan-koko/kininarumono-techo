# .github/workflows/backfill-codes.yml
# 手動実行(workflow_dispatch)で、code:未設定の既存カードにitemCodeを引き当ててPRを作る（一度きりの棚卸し）。
name: Backfill item codes
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Backfill item codes
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          node tools/backfill-codes.mjs | tee backfill-summary.txt
          echo '## itemCodeバックフィル結果' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat backfill-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backfill-report
          path: backfill-report.json
      - name: Create PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "chore(pick): 既存カードにitemCodeをバックフィル"
          branch: auto/backfill-codes
          delete-branch: true
          title: "itemCodeバックフィル（要確認）"
          body: |
            code:未設定の既存カードに現行itemCodeを自動引き当てしました。
            自動マッチのため、内容（特に別商品への誤マッチが無いか）を確認してからマージしてください。
            添付の backfill-report.json も参照。
          add-paths: |
            public/js/main.js
            public/index.html
            public/read/*.html
